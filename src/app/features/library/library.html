<div class="library-container">

  @if (isProcessing) {
    <div class="loading-overlay">
      <mat-spinner diameter="40"></mat-spinner>
      <p>Synchronizing local database expansion storage layers...</p>
    </div>
  }

  @if (uiInstalledSets$ | async; as installedSets) {
    <div class="sets-grid">

      <button
        type="button"
        class="set-tile-card install-tile"
        (click)="onInstallClick()"
        [disabled]="isProcessing || showInstall"
        aria-label="Install New Set"
      >
        <div class="tile-body install-body">
          <mat-icon class="install-icon">add</mat-icon>
          <div class="set-details">
            <h3>Install New Set</h3>
            <span class="badge">Add expansion</span>
          </div>
        </div>
      </button>

      @for (set of installedSets; track set.id) {
        <div
          class="set-tile-card"
          [style.background-image]="set.resolvedCoverArt ? 'url(' + set.resolvedCoverArt + ')' : null"
          (click)="onSelectSet(set)"
          [class.active]="(setService.activeContext$ | async)?.setInfo?.id === set.id">

          <div class="tile-scrim"></div>

          <button class="delete-btn" (click)="onDeleteSet($event, set)" [disabled]="isProcessing" title="Uninstall Set">
            <mat-icon>close</mat-icon>
          </button>

          <div class="tile-body">
            <img [src]="set.iconSvgUri" class="set-icon-vector" alt="" />
            <div class="set-details">
              <h3>{{ set.name }}</h3>
              <span class="badge">{{ set.code.toUpperCase() }}</span>
            </div>
          </div>
        </div>
      }

    </div>
  }

  @if (showInstall) {
    <div class="install-overlay" role="dialog" aria-modal="true" aria-label="Install a set">
      <button
        type="button"
        class="install-overlay-backdrop"
        (click)="onInstallDismiss()"
        aria-label="Close install"
      ></button>
      <div class="install-overlay-panel">
        <app-set-install
          (dismiss)="onInstallDismiss()"
          (completed)="onInstallCompleted($event)"
        />
      </div>
    </div>
  }
</div>
