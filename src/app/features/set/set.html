<div class="set-board">
  @if (boardShell$ | async; as board) {
    @if (patternState$ | async; as patternState) {
      <div class="set-board-layout">
        @if (decksSidebarOpen) {
          <app-set-decks-drawer
            [decksByStatus]="board.decksByStatus"
            [selectedTheme]="selectedTheme"
            (closeSidebar)="toggleDecksSidebar()"
            (themeSelect)="toggleThemeSelection($event)"
          />
        }

        <div class="set-main">
          <div class="set-main-scroll">
            <div class="set-main-upper">
              <div class="set-main-head">
                @if (!decksSidebarOpen) {
                  <button
                    type="button"
                    class="deck-drawer-toggle"
                    [class.peek-hot]="!decksSidebarOpen && dragState.peekDrawer()"
                    (click)="toggleDecksSidebar()"
                    aria-label="Show decks panel"
                  >
                    <mat-icon>chevron_right</mat-icon>
                  </button>
                }
                <app-set-assignment-metrics [metrics]="board.metrics" />
              </div>

              <app-set-discovery-pool
                [scoped]="board.scoped"
                [remaining]="board.remaining"
                [total]="board.total"
                [scopedColors]="scopedColors"
                [drainNeedsWork]="drainNeedsWork"
                (colorScopeChange)="toggleColorScope($event)"
                (drainNeedsWorkChange)="onDrainNeedsWorkChange($event)"
              />

              <app-set-patterns-panel
                [patternState]="patternState"
                [selectedTheme]="selectedTheme"
                [drawerOpen]="decksSidebarOpen"
                (themeSelect)="toggleThemeSelection($event)"
              />
            </div>
          </div>

          <app-set-theme-preview
            #themePreview
            [pool]="board.pool"
            [selectedTheme]="selectedTheme"
            (themeClear)="clearThemeSelection()"
          />
        </div>
      </div>
    }
  }
</div>
