<div class="wrapper">
<mat-card class="add-set-card">
  <form [formGroup]="form" (ngSubmit)="submit()" class="add-set-form">
    <h2 class="card-title">Install a set</h2>
    <p class="description-text">Search by name or code. Only this set’s catalog will be used for Arena imports.</p>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Set name or code</mat-label>
      <input type="text" matInput formControlName="search" [matAutocomplete]="auto" />

      <mat-autocomplete #auto="matAutocomplete" [displayWith]="displaySet">
        @for (set of (filteredSets$ | async); track set.code) {
          <mat-option [value]="set">
            {{ set.name }} ({{ set.code.toUpperCase() }})
          </mat-option>
        }
      </mat-autocomplete>

      @if (isLoadingCatalog) {
        <mat-progress-spinner
          matSuffix
          diameter="24"
          mode="indeterminate"
          class="spinner">
        </mat-progress-spinner>
      }
    </mat-form-field>

    @if (errorMessage) {
      <div class="error-banner">{{ errorMessage }}</div>
    }

    <div class="actions-panel">
      <a mat-button routerLink="/library" [disabled]="isInstalling">Cancel</a>
      <button mat-raised-button color="primary"
              type="submit"
              [disabled]="form.invalid || isInstalling || isLoadingCatalog">
        @if (isInstalling) {
          <mat-spinner diameter="20" class="inline-spinner"></mat-spinner>
          Installing…
        } @else {
          Add Set
        }
      </button>
    </div>
  </form>
</mat-card>
</div>
