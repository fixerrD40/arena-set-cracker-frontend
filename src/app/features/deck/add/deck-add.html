<mat-card class="add-deck-card">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="add-deck-form">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Deck Name</mat-label>
      <input matInput formControlName="name" placeholder="Enter deck name" required />

      @if (form.controls.name.invalid && form.controls.name.touched) {
        <mat-error>Name is required</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Optional: Arena Deck Export</mat-label>
      <textarea
        matInput
        formControlName="arenaDeck"
        placeholder="Paste an MTG Arena deck export for this set"
        rows="8"
      ></textarea>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || !activeSet">
      Save Deck Configuration
    </button>
  </form>

  @if (strippedNotice) {
    <div class="stripped-notice">
      {{ strippedNotice }}
    </div>
  }

  @if (errorMessage) {
    <div class="error-message">
      {{ errorMessage }}
    </div>
  }
</mat-card>
