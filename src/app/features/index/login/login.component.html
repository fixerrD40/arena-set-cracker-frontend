<div class="wrapper">
  <mat-card appearance="raised">
    <h2 class="card-title">Cloud Login</h2>

    <form [formGroup]="form" (ngSubmit)="login()">
      <!-- Updated to match outline theme style consistency -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Username or Email</mat-label>
        <input matInput formControlName="username" autocomplete="username" required />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" required />
      </mat-form-field>

      <div *ngIf="error" class="error-banner">{{ error }}</div>

      <div class="actions-panel">
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || isLoading">
          <mat-progress-spinner
            *ngIf="isLoading"
            diameter="20"
            mode="indeterminate"
            color="accent"
            class="inline-spinner"
          ></mat-progress-spinner>
          <span *ngIf="!isLoading">Restore Cloud Workspace</span>
        </button>
      </div>
    </form>

    <p class="helper-text">
      <a routerLink="/request-password-reset">Forgot your password?</a>
    </p>
    <p class="helper-text">
      <!-- Corrected path to point returning fresh setups back into onboarding -->
      New to this device? <a routerLink="/welcome">Set up your workspace profile</a>
    </p>
  </mat-card>
</div>
