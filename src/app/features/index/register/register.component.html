<div class="wrapper">
  <mat-card appearance="raised">
    <h2 class="card-title">Link Account to Cloud</h2>
    <form [formGroup]="form" (ngSubmit)="register()">

      <!-- Email Field Block -->
      <div class="form-field-with-tooltip">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />

          <!-- MATSUFFIX: Places your tooltip container perfectly inline inside the outline box -->
          <span matSuffix class="tooltip-wrapper-suffix">
            <mat-icon class="info-icon">info</mat-icon>
            <span class="tooltip-text">
              Your email is securely hashed in the backend.<br />
              You will not be emailed unless you resupply your email for password reset and its hash matches.
            </span>
          </span>
        </mat-form-field>
      </div>


      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Workspace Profile Name</mat-label>
        <input matInput formControlName="username" readonly />
        <mat-hint>Pulled from your local application profile configuration</mat-hint>
      </mat-form-field>

      <!-- Password Field Block -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="new-password" />
      </mat-form-field>

      <!-- Context Error Feedback -->
      <div *ngIf="errorMessage" class="error-banner">
        {{ errorMessage }}
      </div>

      <!-- Action Footer Submission Button -->
      <div class="actions-panel">
        <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || isLoading">
          <mat-progress-spinner
            *ngIf="isLoading"
            diameter="20"
            mode="indeterminate"
            color="accent"
            class="inline-spinner"
          ></mat-progress-spinner>
          <span *ngIf="!isLoading">Secure Backup Workspace</span>
        </button>
      </div>
    </form>
  </mat-card>
</div>
