<div class="wrapper">
  <mat-card appearance="raised">
    <h2 class="card-title">Reset Password</h2>

    <form [formGroup]="form" (ngSubmit)="requestReset()">
      <!-- Updated to match outline visual theme continuity -->
      <mat-form-field appearance="outline">
        <mat-label>Email Address</mat-label>
        <input matInput formControlName="email" type="email" autocomplete="email" required />
      </mat-form-field>

      <!-- Balanced contextual feedback messaging blocks -->
      <div *ngIf="error" class="error">{{ error }}</div>
      <div *ngIf="success" class="success-banner"> Check your inbox for a reset link. </div>

      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || isLoading">
        <mat-progress-spinner
          *ngIf="isLoading"
          diameter="20"
          mode="indeterminate"
          color="accent"
          class="inline-spinner"
        ></mat-progress-spinner>
        <span *ngIf="!isLoading">Send Reset Link</span>
      </button>
    </form>

    <!-- Added public breakout route target path link -->
    <p class="helper-text">
      <a routerLink="/login">Back to Sign In</a>
    </p>
  </mat-card>
</div>
