<div class="wrapper">
  <mat-card appearance="raised">
    <h2 class="card-title">Choose New Password</h2>

    <!-- Form hides automatically once completed successfully, clearing screen clutter -->
    <form *ngIf="!success" [formGroup]="form" (ngSubmit)="resetPassword()">
      <!-- Updated style parameters to match outline theme consistency -->
      <mat-form-field appearance="outline">
        <mat-label>New Password</mat-label>
        <input matInput formControlName="newPassword" type="password" autocomplete="new-password" required />
      </mat-form-field>

      <div *ngIf="error" class="error">{{ error }}</div>

      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || isLoading">
        <mat-progress-spinner
          *ngIf="isLoading"
          diameter="20"
          mode="indeterminate"
          color="accent"
          class="inline-spinner"
        ></mat-progress-spinner>
        <span *ngIf="!isLoading">Update Password</span>
      </button>
    </form>

    <!-- SUCCESS LANDING STATE: Visually transitions user cleanly to recovery completion -->
    <div *ngIf="success" class="success-landing-wrapper">
      <div class="success-banner">Your password has been reset successfully.</div>

      <p class="helper-text">
        You can now securely connect your local workspace down to your devices.
      </p>

      <div class="actions-panel">
        <a mat-raised-button color="primary" routerLink="/login" style="width: 100%; text-align: center;">
          Proceed to Sign In
        </a>
      </div>
    </div>
  </mat-card>
</div>
